<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>鞋库拍照匹配</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>鞋库拍照匹配</h1>
      <p>纯前端 · 本机存储 · Top 5</p>
    </div>
    <span id="dbCount" class="badge">0 双</span>
  </header>

  <main>
    <nav class="tabs" aria-label="功能切换">
      <button class="tab active" data-tab="search">拍照查鞋</button>
      <button class="tab" data-tab="add">鞋款入库</button>
      <button class="tab" data-tab="manage">数据管理</button>
    </nav>

    <section id="search" class="panel active">
      <div class="card hero-card">
        <h2>拍照或选择鞋子照片</h2>
        <p>建议与库存照角度接近，鞋子尽量占满画面，背景保持简单。</p>
        <label class="primary-btn file-btn">
          <input id="queryInput" type="file" accept="image/*" capture="environment" />
          拍照查询
        </label>
        <img id="queryPreview" class="preview hidden" alt="查询照片预览" />
        <div id="queryStatus" class="status"></div>
      </div>
      <div id="results" class="results"></div>
    </section>

    <section id="add" class="panel">
      <form id="addForm" class="card form-card">
        <h2>单双入库</h2>
        <label>鞋子编号<input id="shoeCode" required maxlength="80" placeholder="例如：A-00125" /></label>
        <label>存放位置<input id="shoeLocation" required maxlength="120" placeholder="例如：3号仓-B区-12架" /></label>
        <label class="secondary-btn file-btn">
          <input id="stockInput" type="file" accept="image/*" capture="environment" required />
          拍摄库存照
        </label>
        <img id="stockPreview" class="preview hidden" alt="库存照片预览" />
        <button id="saveBtn" class="primary-btn" type="submit">计算指纹并保存</button>
        <div id="addStatus" class="status"></div>
      </form>
    </section>

    <section id="manage" class="panel">
      <div class="card">
        <h2>数据管理</h2>
        <p>数据默认保存在当前浏览器。清理浏览器数据或更换手机前，请先导出备份。</p>
        <div class="button-grid">
          <button id="exportBtn" class="secondary-btn">导出备份</button>
          <label class="secondary-btn file-btn">
            <input id="importInput" type="file" accept="application/json,.json" />
            导入备份
          </label>
          <button id="listBtn" class="secondary-btn">查看最近入库</button>
          <button id="clearBtn" class="danger-btn">清空全部数据</button>
        </div>
        <div id="manageStatus" class="status"></div>
      </div>
      <div id="inventoryList" class="inventory-list"></div>
    </section>
  </main>

  <template id="resultTemplate">
    <article class="result-card">
      <div class="rank"></div>
      <img class="result-img" alt="库存照" />
      <div class="result-info">
        <h3 class="result-code"></h3>
        <p class="result-location"></p>
        <div class="score-row"><span>相似度</span><strong class="result-score"></strong></div>
        <div class="score-bar"><i></i></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
